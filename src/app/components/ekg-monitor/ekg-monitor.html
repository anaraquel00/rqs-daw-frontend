<!-- src/app/components/ekg-monitor/ekg-monitor.html -->
<div class="ekg-container">
  <!-- Cabeçalho do Radar de Equipamento Médico -->
  <div class="radar-header">
    <div class="pulse-dot" [class.active]="isPlaying"></div>
    <h3>{{ lang.t().EKG_MONITOR_TITLE }}</h3>
  </div>

  <!-- Tela do Osciloscópio com o Canvas e a Grade Analógica -->
  <div class="canvas-wrapper">
    <!-- O Canvas físico onde a caneta de fósforo verde desenha a onda -->
    <canvas #ekgCanvas></canvas>

    <!-- Suas linhas de grade personalizadas de 20px via SCSS -->
    <div class="grid-overlay"></div>
  </div>

  <!-- Botão de controle de reprodução integrado -->
  <div class="controls" *ngIf="audioUrl">
    <button class="btn-play" [class.playing]="isPlaying" (click)="togglePlay()">
      {{ isPlaying ? 'STOP' : 'PLAY' }}
    </button>
  </div>
</div>
