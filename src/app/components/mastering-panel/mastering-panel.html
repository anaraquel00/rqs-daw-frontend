<div class="mastering-board" *ngIf="originalFile">
  <!-- Reprodutor e Toggle A/B -->
  <div class="player-section">

    <!-- 💿 MOTOR ORIGINAL -->
    <audio [src]="originalAudioUrl" controls class="cyber-player"
           [style.display]="modoAudicao === 'original' ? 'block' : 'none'">
    </audio>

    <!-- 🎛️ MOTOR MASTERIZADO -->
    <audio *ngIf="masteredAudioUrl" [src]="masteredAudioUrl" controls class="cyber-player"
           [style.display]="modoAudicao === 'master' ? 'block' : 'none'">
    </audio>

    <div class="cyber-player placeholder" *ngIf="modoAudicao === 'master' && !masteredAudioUrl" style="height: 40px;"></div>

    <div class="toggle-container">
      <button class="toggle-btn"
              [class.active]="modoAudicao === 'original'"
              (click)="alternarModo('original')">
        {{ lang.t().ORIGINAL }}
      </button>

      <div class="switch" (click)="alternarModo(modoAudicao === 'original' ? 'master' : 'original')">
        <div class="slider" [class.on]="modoAudicao === 'master'"></div>
      </div>

      <button class="toggle-btn"
              [class.active]="modoAudicao === 'master'"
              [disabled]="!masteredAudioUrl"
              (click)="alternarModo('master')">
        {{ lang.t().MASTER }}
      </button>
    </div>

    <div class="volume-match">
      <input type="checkbox" id="volMatch" [(ngModel)]="volumeMatch" disabled>
      <label for="volMatch">{{ lang.t().VOLUME_MATCH }}</label>
    </div>
  </div>

  <hr class="cyber-divider">

  <!-- Controles de Engenharia -->
  <div class="controls-section">
    <!-- Bloco 1: Perfil Acústico -->
    <div class="control-group">
      <h4>{{ lang.t().PERFIL_ACUSTICO }}</h4>
      <div class="btn-group profiles-grid">
        <button [class.selected]="estiloSelecionado === 'thunder'" (click)="selecionarEstilo('thunder')">
          {{ lang.t().THUNDER }}
        </button>
        <button [class.selected]="estiloSelecionado === 'clear_sky'" (click)="selecionarEstilo('clear_sky')">
          {{ lang.t().CLEAR_SKY }}
        </button>
        <button [class.selected]="estiloSelecionado === 'sunroof'" (click)="selecionarEstilo('sunroof')">
          {{ lang.t().SUNROOF }}
        </button>
        <button [class.selected]="estiloSelecionado === 'aurora'" (click)="selecionarEstilo('aurora')">
          {{ lang.t().AURORA }}
        </button>
      </div>
    </div>

    <!-- Bloco 2: Controle de Intensidade -->
    <div class="control-group">
      <h4>{{ lang.t().INTENSIDADE_MASTER }}</h4>
      <div class="btn-group intensity-selector">
        <button [class.selected]="intensidadeSelecionada === 'baixa'" (click)="selecionarIntensidade('baixa')">
          {{ lang.t().BAIXA }}
        </button>
        <button [class.selected]="intensidadeSelecionada === 'media'" (click)="selecionarIntensidade('media')">
          {{ lang.t().MEDIA }}
        </button>
        <button [class.selected]="intensidadeSelecionada === 'alta'" (click)="selecionarIntensidade('alta')">
          {{ lang.t().ALTA }}
        </button>
      </div>
    </div>
  </div>

   <!-- 🟢 BADGE DO CONSUMO DO PLANO (Estilo Telemetria de Transmissão RQS) [1] -->
  <div class="plan-usage-badge" style="margin-top: 20px; padding: 10px; background: rgba(0, 240, 255, 0.03); border: 1px dashed rgba(0, 240, 255, 0.15); border-radius: 6px; font-family: monospace; font-size: 11px; text-align: center;">
    <span *ngIf="!auth.isPremium()" style="color: #8b949e;">
      ⚡ {{ lang.t().FREE_USAGE_LABEL }}: <strong style="color: #00f0ff;">{{ auth.remainingMasters() }} / 3</strong>
    </span>
    <span *ngIf="auth.isPremium()" style="color: #00ff88; font-weight: bold; text-shadow: 0 0 6px rgba(0, 255, 136, 0.3);">
      💎 {{ lang.t().PRO_USAGE_LABEL }}
    </span>
  </div>

  <div class="action-buttons" style="display: flex; gap: 10px; margin-top: 20px;">
    <!-- O preview de 15s está SEMPRE liberado para todos! -->
    <button class="btn-secondary" (click)="dispararPreview()" [disabled]="isProcessing">
      {{ isProcessing ? lang.t().ANALYZING : lang.t().HEAR_TEST }}
    </button>

    <!-- O botão de master completa fica desativado se as 3 gratuitas acabarem e o usuário for Free -->
    <button
      class="btn-process"
      (click)="dispararProcessamento()"
      [disabled]="isProcessing || (!auth.canMaster())">
      {{ isProcessing ? lang.t().PROCESSING_ACUSTICO : lang.t().MASTER_FULL }}
    </button>
  </div>
</div>
