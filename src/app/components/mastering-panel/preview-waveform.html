<div
  #waveformHost
  class="waveform-host"
  [class.waveform-compact]="compact"
  [class.waveform-compact-interactive]="
    compact && compactInteractive
  "
  [class.waveform-disabled]="disabled"
  [attr.role]="
    compact
      ? (
          compactInteractive
            ? 'slider'
            : 'img'
        )
      : null
  "
  [attr.aria-label]="
    compact
      ? (
          compactInteractive
            ? 'Seek audio waveform'
            : 'Audio waveform'
        )
      : null
  "
  [attr.aria-valuemin]="
    compactInteractive
      ? viewStartSeconds()
      : null
  "
  [attr.aria-valuemax]="
    compactInteractive
      ? viewEndSeconds()
      : null
  "
  [attr.aria-valuenow]="
    compactInteractive ? currentTime : null
  "
  (pointerdown)="onHostPointerDown($event)"
  (pointermove)="onHostPointerMove($event)"
  (pointerup)="onHostPointerUp($event)"
  (pointercancel)="onHostPointerUp($event)">
  <canvas #waveformCanvas class="waveform-canvas" aria-hidden="true"></canvas>
  @if (!compact) {
    <div
      class="preview-region"
      [style.left.%]="previewLeftPercent()"
      [style.width.%]="previewWidthPercent()"
      (pointerdown)="onRegionPointerDown($event)"
      role="slider"
      aria-label="15-second Preview source range"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="duration"
      [attr.aria-valuenow]="previewStart">
      <span class="preview-grip">↔ {{ rangeLabel() }}</span>
    </div>
  }

  @if (!compact || showPlayhead) {
    <div
      class="waveform-playhead"
      [class.waveform-local-playhead]="compact"
      [style.left.%]="playheadPercent()"
      aria-hidden="true">
    </div>
  }
</div>
