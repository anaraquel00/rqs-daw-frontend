<header class="uplink-page-header">
  <div>
    <h1>{{ lang.tr().UPLINK_PAGE_TITLE }}</h1>
    <p>{{ lang.tr().UPLINK_PAGE_DESC }}</p>
  </div>
  <button class="create-toggle" type="button" [disabled]="creating()" [attr.aria-expanded]="createOpen()" aria-controls="uplink-create-form" (click)="toggleCreate()">
    {{ createOpen() ? lang.tr().UPLINK_HIDE_CREATE : lang.tr().UPLINK_CREATE_LINK }}
  </button>
</header>

<div class="rqs-linktwin-panel" id="uplink-create-form" [hidden]="!createOpen()">
  <h2>{{ lang.tr().UPLINK_CREATE_LINK }}</h2>
  <details class="uplink-info">
    <summary>{{ lang.tr().UPLINK_ABOUT }}</summary>
    <p>{{ lang.tr().uplinkDesc }}</p>
  </details>

  <div class="platform-indicators" aria-hidden="true">
    <span class="platform-icon" [class.active]="detectedPlatform() === 'spotify'">Spotify</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'soundcloud'">SoundCloud</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'youtube'">YouTube</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'bandcamp'">Bandcamp</span>
  </div>

  <div class="input-group">
    <label for="uplink-target-url">{{ lang.tr().UPLINK_DESTINATION }}</label>
    <input id="uplink-target-url" type="url" [ngModel]="targetUrl()" (ngModelChange)="targetUrl.set($event)" placeholder="https://open.spotify.com/track/...">
  </div>

  <div class="input-group">
    <label for="uplink-custom-slug">{{ lang.tr().slugLabel }}</label>
    <input id="uplink-custom-slug" type="text" [ngModel]="customSlug()" (ngModelChange)="customSlug.set($event)" placeholder="factory-reset">
  </div>

  <button class="create-submit" type="button" [disabled]="creating()" (click)="compileLink()">{{ lang.tr().UPLINK_CREATE_LINK }}</button>

  @if (errorMessage()) {
    <p class="error-banner" role="alert">{{ errorMessage() }}</p>
  }

  @if (compiledLink()) {
    <div class="output-box" role="status">
      <span class="url-result">{{ compiledLink() }}</span>
      <button class="btn-copy" type="button" (click)="copyToClipboard()">
        {{ copied() ? lang.tr().copiedLink : lang.tr().copyLink }}
      </button>
    </div>
  }
</div>
