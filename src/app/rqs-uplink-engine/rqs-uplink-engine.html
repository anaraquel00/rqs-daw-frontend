<div class="rqs-linktwin-panel">
  <h3>🔗 {{ lang.tr().uplinkTitle }}</h3>

  <div class="status-badge">
    <span class="pulse">●</span> {{ lang.tr().uplinkBadge }}
  </div>

  <p class="desc">{{ lang.tr().uplinkDesc }}</p>

  <div class="platform-indicators">
    <span class="platform-icon" [class.active]="detectedPlatform() === 'spotify'">Spotify</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'soundcloud'">SoundCloud</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'youtube'">YouTube</span>
    <span class="platform-icon" [class.active]="detectedPlatform() === 'bandcamp'">Bandcamp</span>
  </div>

  <div class="input-group">
    <label>{{ lang.tr().urlLabel }}</label>
    <input
      type="text"
      [ngModel]="targetUrl()"
      (ngModelChange)="targetUrl.set($event)"
      placeholder="https://open.spotify.com/track/...">
  </div>

  <div class="input-group">
    <label>{{ lang.tr().slugLabel }}</label>
    <input
      type="text"
      [ngModel]="customSlug()"
      (ngModelChange)="customSlug.set($event)"
      placeholder="ex: minha-nova-faixa">
  </div>

  <button class="btn-magenta" (click)="compileLink()">{{ lang.tr().compileBtn }}</button>

 @if (errorMessage()) {
    <div class="error-banner" style="background: rgba(255, 0, 85, 0.15); border: 1px solid #ff0055; color: #ff0055; padding: 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 15px;">
      ⚠️ {{ errorMessage() }}
    </div>
  }

  @if (compiledLink()) {
    <div class="output-box">
      <span class="url-result">{{ compiledLink() }}</span>
      <button class="btn-copy" (click)="copyToClipboard()">
        {{ copied() ? lang.tr().copiedLink : lang.tr().copyLink }}
      </button>
    </div>
  }
</div>
