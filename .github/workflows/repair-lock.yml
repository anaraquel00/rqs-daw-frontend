name: Temporary package-lock security refresh

on:
  push:
    branches:
      - feat/founding-referral-prelaunch
    paths:
      - .github/workflows/repair-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: feat/founding-referral-prelaunch

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh package lock from security overrides
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lock
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "chore: refresh lockfile after security overrides"
          git push origin HEAD:feat/founding-referral-prelaunch
