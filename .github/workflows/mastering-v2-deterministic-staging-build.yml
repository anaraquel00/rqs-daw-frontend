name: Mastering V2 Deterministic Staging Build

on:
  push:
    branches:
      - integration/mastering-v2-secure-p1-20260816
      - phase-a/staging-code-20260816
  pull_request:
    branches:
      - integration/mastering-v2-final-beta-20260812-frontend
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-build-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build deterministic staging bundle
        run: npm run build:staging -- --output-path dist/staging-contract

      - name: Verify staging bundle target isolation
        shell: bash
        run: |
          set -euo pipefail

          STAGING_BACKEND_URL="$(
            sed -n "s/^[[:space:]]*baseUrl:[[:space:]]*'\([^']*\)'.*/\1/p" \
              src/environments/environment.staging.ts | head -n 1
          )"

          if [ -z "$STAGING_BACKEND_URL" ]; then
            echo 'ERROR: staging baseUrl could not be read from environment.staging.ts'
            exit 1
          fi

          case "$STAGING_BACKEND_URL" in
            *m2ud3r3gh7vocnc3hzvhnv4s4m0dmujw.lambda-url.sa-east-1.on.aws*)
              echo 'ERROR: staging environment targets production backend.'
              exit 1
              ;;
          esac

          grep -R -F -q 'uwrqbywapomuloresoek' dist/staging-contract
          grep -R -F -q "$STAGING_BACKEND_URL" dist/staging-contract

          if grep -R -F -q 'ucearnthodrltkvkmhit' dist/staging-contract; then
            echo 'ERROR: production Supabase ref leaked into staging bundle.'
            exit 1
          fi

          if grep -R -F -q 'm2ud3r3gh7vocnc3hzvhnv4s4m0dmujw.lambda-url.sa-east-1.on.aws' dist/staging-contract; then
            echo 'ERROR: production backend URL leaked into staging bundle.'
            exit 1
          fi

          echo "STAGING_BACKEND_URL_BOUNDARY: $STAGING_BACKEND_URL"
          echo 'DETERMINISTIC_STAGING_BUILD: PASS'
